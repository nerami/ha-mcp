name: Concierge — Promote Dev to Stable

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for the new stable version"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Run the promote transform in place
        id: promote
        run: |
          set -euo pipefail
          NEW=$(python3 scripts/concierge_sync.py --direction promote --bump "${{ inputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
      - name: Verify transform exactness (drift guards)
        run: uv run pytest tests/src/unit/test_concierge_sync.py -q
      - name: Commit on a branch and open a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.ref_name }}
          NEW_VERSION: ${{ steps.promote.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="promote-concierge/$NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add homeassistant-addon-concierge/
          git commit -m "chore(addon): promote concierge dev -> stable $NEW_VERSION"
          git push -u origin "$BRANCH"
          gh pr create --draft --base "$BASE_REF" --head "$BRANCH" \
            --title "chore(addon): promote concierge dev -> stable $NEW_VERSION" \
            --body "Generated by the concierge-promote workflow. Config-identity transform of the dev flavor onto stable (slug/name/boot/stage/version + Dockerfile labels + doc framing); backend/frontend byte-identical. CHANGELOG.md and the two security re-decisions (ingress-guard live verification, hassio_api least-privilege) are for the human reviewer. AGENTS.md still reads dev-centric beyond the stripped surface tokens (dev paths, 'dev flavor is canonical' framing) and needs a manual pass before merge."
