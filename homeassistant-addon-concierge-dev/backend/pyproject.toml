[project]
name = "concierge-backend"
# Static placeholder — the add-on's real version lives in config.yaml (repo
# convention; keeps Docker dependency-layer caching intact).
version = "0.0.0"
description = "Concierge add-on backend: Pydantic AI agent over ha-mcp, streaming AG-UI"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[ag-ui,mcp,openai,anthropic]==2.8.0",
    "ha-mcp==7.12.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "httpx>=0.28",
    "mypy>=1.14",
    "ruff>=0.9",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["concierge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
